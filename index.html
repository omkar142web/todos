<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Focus — Todo</title>

    <style>
      :root {
        --bg: #f7f7f5;
        --surface: #ffffff;
        --surface-2: #f1f1ef;
        --border: #e5e5e2;
        --text: #1d1d1f;
        --muted: #777773;
        --muted-2: #a1a19b;
        --accent: #1d1d1f;
        --danger: #d94c4c;
        --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        --radius: 14px;
        --sidebar: 250px;
        --transition: 180ms ease;
      }

      [data-theme="dark"] {
        --bg: #111110;
        --surface: #1a1a18;
        --surface-2: #242422;
        --border: #30302d;
        --text: #f2f2ef;
        --muted: #999993;
        --muted-2: #686862;
        --accent: #f2f2ef;
        --danger: #ff6b6b;
        --shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        min-height: 100vh;
        display: flex;
      }

      /* Sidebar */

      .sidebar {
        width: var(--sidebar);
        flex-shrink: 0;
        min-height: 100vh;
        padding: 22px 14px;
        border-right: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        flex-direction: column;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 10px 24px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .brand-mark {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: var(--accent);
        color: var(--surface);
        font-size: 15px;
      }

      .new-btn {
        width: 100%;
        border: 0;
        border-radius: 11px;
        padding: 11px 14px;
        background: var(--accent);
        color: var(--surface);
        font-weight: 600;
        transition:
          transform var(--transition),
          opacity var(--transition);
        margin-bottom: 18px;
      }

      .new-btn:hover {
        opacity: 0.88;
        transform: translateY(-1px);
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .nav-item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 11px;
        border: 0;
        border-radius: 9px;
        color: var(--muted);
        background: transparent;
        text-align: left;
        transition:
          background var(--transition),
          color var(--transition);
      }

      .nav-item:hover,
      .nav-item.active {
        background: var(--surface-2);
        color: var(--text);
      }

      .nav-icon {
        width: 18px;
        text-align: center;
        opacity: 0.8;
      }

      .nav-count {
        margin-left: auto;
        color: var(--muted-2);
        font-size: 12px;
      }

      .section-label {
        padding: 22px 11px 7px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted-2);
      }

      .folder-row {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .folder-row .nav-item {
        flex: 1;
      }

      .folder-delete {
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted-2);
        opacity: 0;
        transition: opacity var(--transition);
      }

      .folder-row:hover .folder-delete {
        opacity: 1;
      }

      .folder-delete:hover {
        color: var(--danger);
        background: var(--surface-2);
      }

      .add-folder {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 8px 11px;
        text-align: left;
        font-size: 13px;
      }

      .add-folder:hover {
        color: var(--text);
      }

      .sidebar-bottom {
        margin-top: auto;
      }

      /* Main */

      .main {
        flex: 1;
        min-width: 0;
        max-width: 980px;
        margin: 0 auto;
        padding: 42px 46px 80px;
        width: 100%;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 30px;
      }

      .page-title {
        margin: 0;
        font-size: 30px;
        line-height: 1.15;
        letter-spacing: -0.04em;
      }

      .page-subtitle {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .top-actions {
        display: flex;
        gap: 7px;
      }

      .icon-btn {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--muted);
        transition: all var(--transition);
      }

      .icon-btn:hover {
        color: var(--text);
        background: var(--surface-2);
      }

      /* Search */

      .search-wrap {
        position: relative;
        margin-bottom: 14px;
      }

      .search {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 13px;
        outline: none;
        padding: 13px 45px 13px 43px;
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow);
        transition: border var(--transition);
      }

      .search:focus {
        border-color: var(--muted-2);
      }

      .search-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted-2);
      }

      .shortcut {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 6px;
        color: var(--muted-2);
        font-size: 11px;
      }

      /* Quick Add */

      .quick-add {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 7px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
        margin-bottom: 26px;
      }

      .quick-add input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        padding: 8px 4px;
        font-size: 14px;
      }

      .quick-add input::placeholder {
        color: var(--muted-2);
      }

      .add-todo {
        border: 0;
        border-radius: 9px;
        background: var(--accent);
        color: var(--surface);
        padding: 9px 15px;
        font-weight: 600;
        font-size: 13px;
      }

      /* Todo list */

      .todo-list {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .todo {
        display: grid;
        grid-template-columns: 24px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 14px 15px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: var(--surface);
        transition:
          transform var(--transition),
          border var(--transition),
          box-shadow var(--transition),
          opacity var(--transition);
      }

      .todo:hover {
        border-color: var(--border);
        box-shadow: var(--shadow);
        transform: translateY(-1px);
      }

      .todo.completed {
        opacity: 0.6;
      }

      .checkbox {
        width: 19px;
        height: 19px;
        border: 1.5px solid var(--muted-2);
        border-radius: 50%;
        background: transparent;
        display: grid;
        place-items: center;
        color: white;
        transition: all var(--transition);
      }

      .checkbox:hover {
        border-color: var(--text);
      }

      .todo.completed .checkbox {
        border-color: var(--accent);
        background: var(--accent);
      }

      .todo.completed .checkbox::after {
        content: "✓";
        font-size: 11px;
        color: var(--surface);
      }

      .todo-main {
        min-width: 0;
      }

      .todo-title {
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        padding: 0;
        width: 100%;
        font-size: 14px;
        font-weight: 500;
      }

      .todo.completed .todo-title {
        text-decoration: line-through;
        color: var(--muted);
      }

      .todo-description {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .todo-meta {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .priority {
        font-size: 10px;
        font-weight: 700;
        padding: 4px 7px;
        border-radius: 6px;
        background: var(--surface-2);
        color: var(--muted);
      }

      .priority.high {
        color: #c64242;
        background: #fff0f0;
      }

      .priority.medium {
        color: #a06c00;
        background: #fff8e6;
      }

      [data-theme="dark"] .priority.high {
        background: #321b1b;
      }

      [data-theme="dark"] .priority.medium {
        background: #302812;
      }

      .due {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }

      .todo-actions {
        display: flex;
        gap: 2px;
        margin-left: 5px;
      }

      .todo-action {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted-2);
        opacity: 0;
        transition: all var(--transition);
      }

      .todo:hover .todo-action {
        opacity: 1;
      }

      .todo-action:hover {
        background: var(--surface-2);
        color: var(--text);
      }

      .todo-action.delete:hover {
        color: var(--danger);
      }

      /* Empty */

      .empty {
        text-align: center;
        padding: 75px 20px;
        color: var(--muted);
      }

      .empty-icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 14px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: var(--surface-2);
        color: var(--muted-2);
        font-size: 20px;
      }

      .empty-title {
        color: var(--text);
        font-weight: 600;
        margin-bottom: 5px;
      }

      .empty-text {
        font-size: 13px;
      }

      /* Modal */

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.32);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 20;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal {
        width: 100%;
        max-width: 500px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 17px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.2);
        padding: 22px;
        animation: modalIn 160ms ease;
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .modal h2 {
        margin: 0 0 20px;
        letter-spacing: -0.03em;
        font-size: 19px;
      }

      .field {
        margin-bottom: 15px;
      }

      .field label {
        display: block;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .field input,
      .field textarea,
      .field select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 9px;
        outline: none;
        background: var(--surface);
        color: var(--text);
        padding: 10px 11px;
      }

      .field textarea {
        min-height: 90px;
        resize: vertical;
      }

      .field input:focus,
      .field textarea:focus,
      .field select:focus {
        border-color: var(--muted-2);
      }

      .modal-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
      }

      .btn {
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 9px 14px;
        background: var(--surface);
        color: var(--text);
        font-weight: 600;
        font-size: 13px;
      }

      .btn.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--surface);
      }

      /* Toast */

      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        padding: 11px 15px;
        background: var(--accent);
        color: var(--surface);
        border-radius: 9px;
        font-size: 13px;
        box-shadow: var(--shadow);
        transform: translateY(15px);
        opacity: 0;
        pointer-events: none;
        transition: all 180ms ease;
        z-index: 50;
      }

      .toast.show {
        opacity: 1;
        transform: none;
      }

      /* Mobile */

      .mobile-header {
        display: none;
      }

      @media (max-width: 760px) {
        .sidebar {
          display: none;
        }

        .mobile-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 15px 18px;
          border-bottom: 1px solid var(--border);
          background: var(--surface);
        }

        .main {
          padding: 28px 17px 60px;
        }

        .topbar {
          margin-bottom: 24px;
        }

        .page-title {
          font-size: 26px;
        }

        .todo {
          grid-template-columns: 24px 1fr;
        }

        .todo-meta {
          grid-column: 2;
          justify-content: flex-start;
        }

        .todo-actions {
          position: absolute;
          right: 9px;
          top: 8px;
        }

        .todo {
          position: relative;
          padding-right: 45px;
        }

        .todo-action {
          opacity: 1;
        }

        .shortcut {
          display: none;
        }

        .quick-add {
          padding: 6px;
        }

        .add-todo {
          padding: 9px 11px;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">✓</div>
          <span>Focus</span>
        </div>

        <button class="new-btn" onclick="openTodoModal()">+ New Todo</button>

        <nav class="nav">
          <button
            class="nav-item active"
            data-view="inbox"
            onclick="changeView('inbox')"
          >
            <span class="nav-icon">□</span>
            <span>Inbox</span>
            <span class="nav-count" id="inboxCount"></span>
          </button>

          <button
            class="nav-item"
            data-view="today"
            onclick="changeView('today')"
          >
            <span class="nav-icon">◷</span>
            <span>Today</span>
            <span class="nav-count" id="todayCount"></span>
          </button>

          <button
            class="nav-item"
            data-view="upcoming"
            onclick="changeView('upcoming')"
          >
            <span class="nav-icon">→</span>
            <span>Upcoming</span>
          </button>

          <button
            class="nav-item"
            data-view="completed"
            onclick="changeView('completed')"
          >
            <span class="nav-icon">✓</span>
            <span>Completed</span>
            <span class="nav-count" id="completedCount"></span>
          </button>
        </nav>

        <div class="section-label">Folders</div>

        <div id="folderList"></div>

        <button class="add-folder" onclick="addFolder()">+ Add folder</button>

        <div class="sidebar-bottom">
          <button class="nav-item" onclick="toggleTheme()">
            <span class="nav-icon" id="themeIcon">☾</span>
            <span id="themeText">Dark mode</span>
          </button>
        </div>
      </aside>

      <div style="flex: 1; min-width: 0">
        <header class="mobile-header">
          <div class="brand" style="padding: 0">
            <div class="brand-mark">✓</div>
            <span>Focus</span>
          </div>

          <button class="icon-btn" onclick="toggleTheme()" id="mobileTheme">
            ☾
          </button>
        </header>

        <main class="main">
          <div class="topbar">
            <div>
              <h1 class="page-title" id="pageTitle">Inbox</h1>
              <p class="page-subtitle" id="pageSubtitle"></p>
            </div>

            <div class="top-actions">
              <button class="icon-btn" onclick="focusSearch()" title="Search">
                ⌕
              </button>
              <button
                class="icon-btn"
                onclick="openTodoModal()"
                title="New todo"
              >
                +
              </button>
            </div>
          </div>

          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input
              id="searchInput"
              class="search"
              type="search"
              placeholder="Search your todos..."
              autocomplete="off"
            />
            <span class="shortcut">/</span>
          </div>

          <div class="quick-add">
            <input
              id="quickInput"
              type="text"
              placeholder="What needs to be done?"
              autocomplete="off"
            />
            <button class="add-todo" onclick="quickAdd()">Add</button>
          </div>

          <section id="todoList" class="todo-list"></section>
        </main>
      </div>
    </div>

    <!-- Todo Modal -->

    <div class="modal-backdrop" id="todoModal">
      <div class="modal">
        <h2 id="modalTitle">New Todo</h2>

        <input type="hidden" id="editId" />

        <div class="field">
          <label>Title</label>
          <input id="todoTitle" placeholder="e.g. Finish project proposal" />
        </div>

        <div class="field">
          <label>Description</label>
          <textarea
            id="todoDescription"
            placeholder="Add some details..."
          ></textarea>
        </div>

        <div class="modal-row">
          <div class="field">
            <label>Due date</label>
            <input id="todoDue" type="date" />
          </div>

          <div class="field">
            <label>Priority</label>
            <select id="todoPriority">
              <option value="none">None</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Folder</label>
          <select id="todoFolder"></select>
        </div>

        <div class="modal-actions">
          <button class="btn" onclick="closeTodoModal()">Cancel</button>
          <button class="btn primary" onclick="saveTodo()">Save Todo</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      /* =========================================
       DATA
    ========================================= */

      const STORAGE_KEY = "focus-todo-app";

      const defaultData = {
        todos: [],
        folders: [
          { id: "personal", name: "Personal" },
          { id: "work", name: "Work" },
          { id: "projects", name: "Projects" },
          { id: "shopping", name: "Shopping" },
        ],
        theme: "light",
      };

      let data = loadData();
      let currentView = "inbox";
      let searchQuery = "";

      function loadData() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);

          if (!saved) return structuredClone(defaultData);

          return {
            ...structuredClone(defaultData),
            ...JSON.parse(saved),
          };
        } catch {
          return structuredClone(defaultData);
        }
      }

      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2);
      }

      /* =========================================
       INITIALIZE
    ========================================= */

      function init() {
        document.documentElement.dataset.theme = data.theme;

        renderFolders();
        updateCounts();
        render();

        document
          .getElementById("quickInput")
          .addEventListener("keydown", (e) => {
            if (e.key === "Enter") quickAdd();
          });

        document
          .getElementById("searchInput")
          .addEventListener("input", (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            render();
          });

        document.addEventListener("keydown", handleShortcuts);

        document.getElementById("todoModal").addEventListener("click", (e) => {
          if (e.target.id === "todoModal") closeTodoModal();
        });
      }

      /* =========================================
       VIEWS
    ========================================= */

      function changeView(view) {
        currentView = view;
        searchQuery = "";
        document.getElementById("searchInput").value = "";

        document.querySelectorAll(".nav-item[data-view]").forEach((item) => {
          item.classList.toggle("active", item.dataset.view === view);
        });

        render();
      }

      function getViewTodos() {
        let todos = [...data.todos];

        if (currentView === "today") {
          const today = todayString();

          todos = todos.filter((todo) => todo.due === today && !todo.completed);
        }

        if (currentView === "upcoming") {
          const today = todayString();

          todos = todos.filter(
            (todo) => todo.due && todo.due > today && !todo.completed,
          );
        }

        if (currentView === "completed") {
          todos = todos.filter((todo) => todo.completed);
        }

        if (currentView.startsWith("folder:")) {
          const folderId = currentView.replace("folder:", "");

          todos = todos.filter(
            (todo) => todo.folderId === folderId && !todo.completed,
          );
        }

        if (currentView === "inbox") {
          todos = todos.filter((todo) => !todo.completed);
        }

        if (searchQuery) {
          todos = todos.filter(
            (todo) =>
              todo.title.toLowerCase().includes(searchQuery) ||
              (todo.description || "").toLowerCase().includes(searchQuery),
          );
        }

        todos.sort((a, b) => {
          if (a.completed !== b.completed) {
            return Number(a.completed) - Number(b.completed);
          }

          if (a.due && b.due) {
            return a.due.localeCompare(b.due);
          }

          if (a.due) return -1;
          if (b.due) return 1;

          return b.createdAt - a.createdAt;
        });

        return todos;
      }

      function render() {
        const todos = getViewTodos();

        const titles = {
          inbox: ["Inbox", "Your active todos"],
          today: ["Today", "Everything due today"],
          upcoming: ["Upcoming", "Todos coming up"],
          completed: ["Completed", "Things you've finished"],
        };

        let title = titles[currentView]?.[0];
        let subtitle = titles[currentView]?.[1];

        if (currentView.startsWith("folder:")) {
          const id = currentView.replace("folder:", "");
          const folder = data.folders.find((f) => f.id === id);

          title = folder ? folder.name : "Folder";
          subtitle = "Todos in this folder";
        }

        if (searchQuery) {
          title = "Search";
          subtitle = `${todos.length} result${todos.length === 1 ? "" : "s"}`;
        }

        document.getElementById("pageTitle").textContent = title;
        document.getElementById("pageSubtitle").textContent =
          subtitle || `${todos.length} todos`;

        const list = document.getElementById("todoList");

        if (!todos.length) {
          list.innerHTML = emptyState();
          return;
        }

        list.innerHTML = todos.map(todoHTML).join("");
      }

      /* =========================================
       TODO RENDERING
    ========================================= */

      function todoHTML(todo) {
        const priority =
          todo.priority && todo.priority !== "none"
            ? `<span class="priority ${todo.priority}">
              ${capitalize(todo.priority)}
             </span>`
            : "";

        const due = todo.due
          ? `<span class="due">${formatDate(todo.due)}</span>`
          : "";

        const description = todo.description
          ? `<div class="todo-description">
              ${escapeHTML(todo.description)}
             </div>`
          : "";

        return `
        <article class="todo ${todo.completed ? "completed" : ""}">
          <button
            class="checkbox"
            aria-label="${todo.completed ? "Mark incomplete" : "Complete todo"}"
            onclick="toggleTodo('${todo.id}')"
          ></button>

          <div class="todo-main">
            <input
              class="todo-title"
              value="${escapeAttr(todo.title)}"
              onchange="updateTitle('${todo.id}', this.value)"
              aria-label="Todo title"
            />
            ${description}
          </div>

          <div class="todo-meta">
            ${priority}
            ${due}
          </div>

          <div class="todo-actions">
            <button
              class="todo-action"
              onclick="editTodo('${todo.id}')"
              title="Edit"
            >✎</button>

            <button
              class="todo-action delete"
              onclick="deleteTodo('${todo.id}')"
              title="Delete"
            >×</button>
          </div>
        </article>
      `;
      }

      function emptyState() {
        const messages = {
          inbox: ["All clear", "You don't have any active todos."],
          today: ["Nothing due today", "Enjoy the rest of your day."],
          upcoming: ["No upcoming todos", "Add a due date to plan ahead."],
          completed: [
            "Nothing completed yet",
            "Finished todos will appear here.",
          ],
        };

        const msg = messages[currentView] || [
          "No todos here",
          "Add a todo to get started.",
        ];

        return `
        <div class="empty">
          <div class="empty-icon">✓</div>
          <div class="empty-title">${msg[0]}</div>
          <div class="empty-text">${msg[1]}</div>
        </div>
      `;
      }

      /* =========================================
       TODO ACTIONS
    ========================================= */

      function quickAdd() {
        const input = document.getElementById("quickInput");
        const title = input.value.trim();

        if (!title) return;

        data.todos.unshift({
          id: uid(),
          title,
          description: "",
          completed: false,
          due: "",
          priority: "none",
          folderId: "",
          createdAt: Date.now(),
        });

        saveData();

        input.value = "";

        updateCounts();
        render();

        toast("Todo added");
      }

      function toggleTodo(id) {
        const todo = data.todos.find((t) => t.id === id);

        if (!todo) return;

        todo.completed = !todo.completed;

        saveData();
        updateCounts();
        render();

        toast(todo.completed ? "Todo completed" : "Todo reopened");
      }

      function updateTitle(id, value) {
        const todo = data.todos.find((t) => t.id === id);

        if (!todo) return;

        value = value.trim();

        if (!value) {
          deleteTodo(id);
          return;
        }

        todo.title = value;

        saveData();
        render();
      }

      function deleteTodo(id) {
        const todo = data.todos.find((t) => t.id === id);

        if (!todo) return;

        if (!confirm(`Delete "${todo.title}"?`)) return;

        data.todos = data.todos.filter((t) => t.id !== id);

        saveData();
        updateCounts();
        render();

        toast("Todo deleted");
      }

      /* =========================================
       MODAL
    ========================================= */

      function openTodoModal(id = null) {
        const modal = document.getElementById("todoModal");

        document.getElementById("editId").value = id || "";

        populateFolderSelect();

        if (id) {
          const todo = data.todos.find((t) => t.id === id);

          if (!todo) return;

          document.getElementById("modalTitle").textContent = "Edit Todo";
          document.getElementById("todoTitle").value = todo.title;
          document.getElementById("todoDescription").value =
            todo.description || "";
          document.getElementById("todoDue").value = todo.due || "";
          document.getElementById("todoPriority").value =
            todo.priority || "none";
          document.getElementById("todoFolder").value = todo.folderId || "";
        } else {
          document.getElementById("modalTitle").textContent = "New Todo";
          document.getElementById("todoTitle").value = "";
          document.getElementById("todoDescription").value = "";
          document.getElementById("todoDue").value = "";
          document.getElementById("todoPriority").value = "none";
          document.getElementById("todoFolder").value = "";
        }

        modal.classList.add("open");

        setTimeout(() => {
          document.getElementById("todoTitle").focus();
        }, 50);
      }

      function closeTodoModal() {
        document.getElementById("todoModal").classList.remove("open");
      }

      function editTodo(id) {
        openTodoModal(id);
      }

      function saveTodo() {
        const id = document.getElementById("editId").value;

        const title = document.getElementById("todoTitle").value.trim();

        if (!title) {
          document.getElementById("todoTitle").focus();
          return;
        }

        const todoData = {
          title,
          description: document.getElementById("todoDescription").value.trim(),
          due: document.getElementById("todoDue").value,
          priority: document.getElementById("todoPriority").value,
          folderId: document.getElementById("todoFolder").value,
        };

        if (id) {
          const todo = data.todos.find((t) => t.id === id);

          if (todo) {
            Object.assign(todo, todoData);
            toast("Todo updated");
          }
        } else {
          data.todos.unshift({
            id: uid(),
            ...todoData,
            completed: false,
            createdAt: Date.now(),
          });

          toast("Todo created");
        }

        saveData();
        updateCounts();
        render();
        closeTodoModal();
      }

      function populateFolderSelect() {
        const select = document.getElementById("todoFolder");

        select.innerHTML =
          `<option value="">No folder</option>` +
          data.folders
            .map(
              (folder) =>
                `<option value="${escapeAttr(folder.id)}">
              ${escapeHTML(folder.name)}
            </option>`,
            )
            .join("");
      }

      /* =========================================
       FOLDERS
    ========================================= */

      function renderFolders() {
        const container = document.getElementById("folderList");

        container.innerHTML = data.folders
          .map(
            (folder) => `
        <div class="folder-row">
          <button
            class="nav-item ${currentView === "folder:" + folder.id ? "active" : ""}"
            onclick="changeFolder('${folder.id}')"
          >
            <span class="nav-icon">○</span>
            <span>${escapeHTML(folder.name)}</span>
            <span class="nav-count">
              ${
                data.todos.filter(
                  (t) => t.folderId === folder.id && !t.completed,
                ).length
              }
            </span>
          </button>

          <button
            class="folder-delete"
            onclick="deleteFolder('${folder.id}')"
            title="Delete folder"
          >×</button>
        </div>
      `,
          )
          .join("");
      }

      function changeFolder(id) {
        currentView = "folder:" + id;

        document
          .querySelectorAll(".nav-item[data-view]")
          .forEach((item) => item.classList.remove("active"));

        renderFolders();
        render();
      }

      function addFolder() {
        const name = prompt("Folder name:");

        if (!name || !name.trim()) return;

        const cleanName = name.trim();

        if (
          data.folders.some(
            (f) => f.name.toLowerCase() === cleanName.toLowerCase(),
          )
        ) {
          toast("That folder already exists");
          return;
        }

        data.folders.push({
          id: uid(),
          name: cleanName,
        });

        saveData();
        renderFolders();
        populateFolderSelect();

        toast("Folder created");
      }

      function deleteFolder(id) {
        const folder = data.folders.find((f) => f.id === id);

        if (!folder) return;

        if (
          !confirm(`Delete "${folder.name}"? Todos will remain in your inbox.`)
        ) {
          return;
        }

        data.todos.forEach((todo) => {
          if (todo.folderId === id) {
            todo.folderId = "";
          }
        });

        data.folders = data.folders.filter((f) => f.id !== id);

        if (currentView === "folder:" + id) {
          currentView = "inbox";
        }

        saveData();

        renderFolders();
        updateCounts();
        render();

        toast("Folder deleted");
      }

      /* =========================================
       COUNTS
    ========================================= */

      function updateCounts() {
        const active = data.todos.filter((t) => !t.completed);

        document.getElementById("inboxCount").textContent = active.length || "";

        document.getElementById("completedCount").textContent =
          data.todos.filter((t) => t.completed).length || "";

        const today = todayString();

        document.getElementById("todayCount").textContent =
          active.filter((t) => t.due === today).length || "";

        renderFolders();
      }

      /* =========================================
       THEME
    ========================================= */

      function toggleTheme() {
        data.theme = data.theme === "dark" ? "light" : "dark";

        document.documentElement.dataset.theme = data.theme;

        document.getElementById("themeIcon").textContent =
          data.theme === "dark" ? "☀" : "☾";

        document.getElementById("themeText").textContent =
          data.theme === "dark" ? "Light mode" : "Dark mode";

        document.getElementById("mobileTheme").textContent =
          data.theme === "dark" ? "☀" : "☾";

        saveData();
      }

      /* =========================================
       KEYBOARD SHORTCUTS
    ========================================= */

      function handleShortcuts(e) {
        const active = document.activeElement;
        const typing =
          active &&
          (active.tagName === "INPUT" ||
            active.tagName === "TEXTAREA" ||
            active.tagName === "SELECT");

        if (e.key === "/" && !typing) {
          e.preventDefault();
          focusSearch();
        }

        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          focusSearch();
        }

        if (e.key.toLowerCase() === "n" && !typing) {
          e.preventDefault();
          openTodoModal();
        }

        if (e.key === "Escape") {
          closeTodoModal();
        }
      }

      function focusSearch() {
        const search = document.getElementById("searchInput");

        search.focus();
        search.select();
      }

      /* =========================================
       HELPERS
    ========================================= */

      function todayString() {
        const now = new Date();

        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, "0");
        const d = String(now.getDate()).padStart(2, "0");

        return `${y}-${m}-${d}`;
      }

      function formatDate(dateString) {
        const date = new Date(dateString + "T00:00:00");

        return date.toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
        });
      }

      function capitalize(value) {
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      function escapeHTML(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function escapeAttr(value) {
        return escapeHTML(value);
      }

      let toastTimer;

      function toast(message) {
        const element = document.getElementById("toast");

        element.textContent = message;
        element.classList.add("show");

        clearTimeout(toastTimer);

        toastTimer = setTimeout(() => {
          element.classList.remove("show");
        }, 1800);
      }

      /* =========================================
       START
    ========================================= */

      init();
    </script>
  </body>
</html>
