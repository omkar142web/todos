<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Focus — Todo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f2f2ee'/%3E%3Cpath d='M10 16.5l4.2 4.2L22 12.5' fill='none' stroke='%23141412' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      :root {
        --bg: #121214;
        --surface: #1a1a1f;
        --surface-2: #202028;
        --surface-3: #26262e;
        --border: #2b2b33;
        --border-strong: #3d3d48;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --muted-2: #6e6e7a;
        --accent: #f2f2ee;
        --accent-hover: #ffffff;
        --on-accent: #141412;
        --danger: #ff7a7a;
        --danger-bg: #2a1a1a;
        --success: #4ade80;
        --success-bg: #14281b;
        --warning: #e8b93e;
        --warning-bg: #2a2410;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 34px rgba(0, 0, 0, 0.32);
        --shadow-lg: 0 24px 80px rgba(0, 0, 0, 0.55);
        --radius: 14px;
        --sidebar: 272px;
        --transition: 180ms ease;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button, input, textarea, select { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
        outline: none;
        border-color: var(--accent) !important;
      }

      svg { flex-shrink: 0; display: block; }

      .app { min-height: 100vh; display: flex; position: relative; z-index: 1; }

      /* ---------- Sidebar ---------- */
      .sidebar {
        width: var(--sidebar);
        flex-shrink: 0;
        min-height: 100vh;
        position: sticky;
        top: 0;
        max-height: 100vh;
        overflow-y: auto;
        padding: 22px 14px 16px;
        border-right: 1px solid var(--border);
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
      }

      .brand { display: flex; align-items: center; gap: 11px; padding: 5px 10px 20px; }
      .brand-mark {
        width: 34px; height: 34px;
        display: grid; place-items: center;
        border-radius: 11px;
        background: var(--accent);
        color: var(--on-accent);
        border: 1px solid var(--accent);
      }
      .brand-mark svg { width: 18px; height: 18px; }
      .brand-name { font-weight: 800; letter-spacing: -0.04em; font-size: 17px; line-height: 1; }
      .brand-sub { font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 3px; letter-spacing: 0.01em; }

      .new-btn {
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 650;
        font-size: 14px;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        box-shadow: 0 8px 20px rgba(0,0,0,.14);
        transition: transform var(--transition), opacity var(--transition), background var(--transition), box-shadow var(--transition);
        margin-bottom: 18px;
      }
      .new-btn svg { width: 16px; height: 16px; }
      .new-btn:hover { transform: translateY(-1px); background: var(--accent-hover); box-shadow: 0 12px 26px rgba(0,0,0,.18); }
      .new-btn:active { transform: translateY(0); }
      .new-btn kbd {
        font-size: 11px; font-weight: 700; opacity: .55;
        border: 1px solid currentColor; border-radius: 6px;
        width: 20px; height: 20px; display: grid; place-items: center;
        line-height: 1;
      }

      .nav { display: flex; flex-direction: column; gap: 4px; }
      .nav-item {
        width: 100%;
        display: flex; align-items: center; gap: 11px;
        padding: 9px 11px;
        border: 0; border-radius: 10px;
        color: var(--muted);
        background: transparent;
        text-align: left;
        font-weight: 550; font-size: 14px;
        transition: background var(--transition), color var(--transition), transform var(--transition);
        position: relative;
      }
      .nav-item:hover { background: var(--surface-2); color: var(--text); }
      .nav-item.active { background: var(--surface-3); color: var(--text); font-weight: 650; }
      .nav-item.active::before {
        content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px;
        border-radius: 99px; background: var(--accent);
      }
      .nav-icon {
        width: 32px; height: 32px;
        display: grid; place-items: center;
        border-radius: 9px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        color: var(--muted);
        transition: all var(--transition);
      }
      .nav-item.active .nav-icon, .nav-item:hover .nav-icon {
        background: var(--surface);
        color: var(--text);
        border-color: var(--border-strong);
      }
      .nav-icon svg { width: 16px; height: 16px; }
      .nav-count {
        margin-left: auto;
        min-width: 24px; height: 22px;
        padding: 0 7px;
        display: inline-grid; place-items: center;
        border-radius: 99px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px; font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .nav-item.active .nav-count { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
      .nav-count[hidden] { display: none; }

      .section-label {
        display: flex; align-items: center; justify-content: space-between;
        padding: 22px 11px 8px;
        font-size: 11px; font-weight: 750;
        text-transform: uppercase; letter-spacing: 0.09em;
        color: var(--muted-2);
      }
      .section-label .hint { text-transform: none; letter-spacing: 0; font-weight: 550; }

      .folder-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .folder-dot { width: 8px; height: 8px; border-radius: 99px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
      .folder-delete {
        width: 32px; height: 32px;
        flex-shrink: 0;
        border: 0; border-radius: 8px;
        background: transparent; color: var(--muted-2);
        cursor: pointer;
        opacity: 0; display: grid; place-items: center;
        transition: all var(--transition);
      }
      .nav-item:hover .folder-delete, .nav-item:focus-within .folder-delete, .folder-delete:focus-visible { opacity: 1; }
      .folder-delete svg { width: 15px; height: 15px; }
      .folder-delete:hover { color: var(--danger); background: var(--danger-bg); }

      .add-folder {
        border: 1px dashed var(--border-strong);
        background: transparent;
        color: var(--muted);
        padding: 9px 11px;
        border-radius: 10px;
        text-align: left; font-size: 13px; font-weight: 600;
        display: flex; align-items: center; gap: 8px;
        margin-top: 6px;
        transition: all var(--transition);
      }
      .add-folder svg { width: 15px; height: 15px; }
      .add-folder:hover { color: var(--text); border-color: var(--muted-2); background: var(--surface-2); }

      .sidebar-bottom { margin-top: auto; padding-top: 18px; display: flex; flex-direction: column; gap: 10px; }
      .progress-card {
        border: 1px solid var(--border);
        background: var(--surface-2);
        border-radius: 12px;
        padding: 12px;
      }
      .progress-top { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 650; margin-bottom: 8px; }
      .progress-top span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
      .progress-track { height: 7px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
      .progress-bar { height: 100%; width: 0%; border-radius: 99px; background: var(--accent); transition: width 400ms ease; }
      .kbd-hints { font-size: 11px; color: var(--muted-2); padding: 0 4px; display: flex; gap: 10px; }
      .kbd-hints kbd { border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; font-size: 10px; background: var(--surface); font-weight: 700; }

      /* ---------- Main ---------- */
      .main-col { flex: 1; min-width: 0; }
      .main { flex: 1; min-width: 0; max-width: 760px; margin: 0 auto; padding: 44px 40px 90px; width: 100%; }

      .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 24px; }
      .title-row { display: flex; align-items: center; gap: 12px; }
      .page-title { margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: -0.04em; font-weight: 800; color: var(--text); }
      .date-pill {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 12px; font-weight: 650; color: var(--muted);
        border: 1px solid var(--border); background: var(--surface);
        padding: 6px 10px; border-radius: 99px; white-space: nowrap;
      }
      .date-pill svg { width: 13px; height: 13px; }
      .page-subtitle { margin: 6px 0 0; color: var(--muted); font-size: 13px; font-weight: 500; }

      .top-actions { display: flex; gap: 8px; }
      .icon-btn {
        width: 40px; height: 40px;
        display: grid; place-items: center;
        border: 1px solid var(--border); border-radius: 12px;
        background: var(--surface); color: var(--muted);
        box-shadow: var(--shadow);
        transition: all var(--transition);
      }
      .icon-btn svg { width: 18px; height: 18px; }
      .icon-btn:hover { color: var(--text); background: var(--surface-2); transform: translateY(-1px); border-color: var(--border-strong); }
      .icon-btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
      .icon-btn.primary:hover { background: var(--accent-hover); }
      .mobile-add-text { display: none; }

      /* Search */
      .search-wrap { position: relative; margin-bottom: 12px; }
      .search {
        width: 100%;
        border: 1px solid var(--border); border-radius: 14px;
        outline: none;
        padding: 14px 52px 14px 44px;
        background: var(--surface); color: var(--text);
        box-shadow: var(--shadow);
        font-size: 14px;
        transition: border var(--transition), box-shadow var(--transition);
      }
      .search:focus { border-color: var(--border-strong); box-shadow: var(--shadow); }
      .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted-2); pointer-events: none; }
      .search-icon svg { width: 18px; height: 18px; }
      .shortcut {
        position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
        border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 7px;
        padding: 3px 8px; color: var(--muted-2); font-size: 11px; font-weight: 700; background: var(--surface-2);
      }

      /* Quick Add */
      .quick-add {
        display: flex; align-items: center; gap: 10px;
        padding: 7px 7px 7px 8px;
        border: 1px solid var(--border); border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
        margin-bottom: 26px;
        transition: border var(--transition), box-shadow var(--transition);
      }
      .quick-add:focus-within { border-color: var(--border-strong); box-shadow: var(--shadow); }
      .quick-plus {
        width: 34px; height: 34px; border-radius: 11px; flex-shrink: 0;
        display: grid; place-items: center;
        background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
      }
      .quick-plus svg { width: 16px; height: 16px; }
      .quick-add input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); padding: 10px 4px; font-size: 14px; }
      .quick-add input::placeholder { color: var(--muted-2); }
      .add-todo {
        border: 0; border-radius: 11px;
        background: var(--accent); color: var(--on-accent);
        padding: 10px 16px; font-weight: 650; font-size: 13px;
        display: inline-flex; align-items: center; gap: 7px;
        transition: all var(--transition);
        white-space: nowrap;
      }
      .add-todo svg { width: 14px; height: 14px; }
      .add-todo:hover { background: var(--accent-hover); transform: translateY(-1px); }

      /* Todo list */
      .todo-list { display: flex; flex-direction: column; gap: 10px; }
      .todo {
        display: grid; grid-template-columns: 28px 1fr auto;
        gap: 12px; align-items: center;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: 0 1px 2px rgba(0,0,0,.03);
        transition: transform var(--transition), border var(--transition), box-shadow var(--transition), opacity var(--transition), background var(--transition);
        animation: todoIn 220ms ease both;
      }
      @keyframes todoIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .todo:hover { border-color: var(--border-strong); background: var(--surface-2); box-shadow: var(--shadow); }
      .todo.completed { opacity: 0.5; }
      .todo.completed:hover { transform: none; background: var(--surface); }

      .checkbox {
        width: 24px; height: 24px;
        border: 1.5px solid var(--border-strong);
        border-radius: 50%;
        background: var(--surface);
        display: grid; place-items: center;
        color: var(--on-accent);
        transition: all var(--transition);
        padding: 0;
      }
      .checkbox svg { width: 12px; height: 12px; opacity: 0; transform: scale(.5); transition: all 160ms ease; }
      .checkbox:hover { border-color: var(--text); transform: scale(1.06); }
      .todo.completed .checkbox { border-color: var(--accent); background: var(--accent); }
      .todo.completed .checkbox svg { opacity: 1; transform: scale(1); }

      .todo-main { min-width: 0; }
      .todo-title { border: 0; outline: 0; background: transparent; color: #f3f4f6; padding: 0; width: 100%; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.4; }
      .todo-title:focus { box-shadow: 0 2px 0 var(--text); border-radius: 2px; }
      .todo.completed .todo-title { text-decoration: line-through; color: var(--muted); font-weight: 500; }
      .todo-description { margin-top: 4px; color: var(--muted); font-size: 13px; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .todo-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
      .pill {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 11px; font-weight: 600;
        padding: 5px 9px; border-radius: 99px;
        border: 1px solid var(--border);
        background: var(--surface-2); color: var(--muted);
        white-space: nowrap;
      }
      .pill svg { width: 12px; height: 12px; }
      .priority { text-transform: capitalize; }
      .priority .pdot { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
      .priority.high { color: #ff8a8a; background: #2a1a1a; border-color: #4a2a2a; }
      .priority.medium { color: #e8b93e; background: #2a2410; border-color: #4a421c; }
      .priority.low { color: #4ade80; background: #14281b; border-color: #234d31; }

      .due.overdue { color: #ff8a8a; background: #2a1a1a; border-color: #4a2a2a; }
      .folder-tag .fdot { width: 7px; height: 7px; border-radius: 99px; }

      .todo-actions { display: flex; gap: 2px; margin-left: 4px; }
      .todo-action {
        width: 34px; height: 34px;
        border: 0; border-radius: 9px;
        background: transparent; color: var(--muted-2);
        display: grid; place-items: center;
        opacity: 0; transition: all var(--transition);
      }
      .todo-action svg { width: 15px; height: 15px; }
      .todo:hover .todo-action, .todo-action:focus-visible { opacity: 1; }
      .todo-action:hover { background: var(--surface-2); color: var(--text); }
      .todo-action.delete:hover { color: var(--danger); background: var(--danger-bg); }

      /* Empty */
      .empty { text-align: center; padding: 64px 20px; color: var(--muted); border: 1px dashed var(--border-strong); border-radius: 18px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
      .empty-art { width: 88px; height: 88px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 26px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
      .empty-art svg { width: 42px; height: 42px; }
      .empty-title { color: var(--text); font-weight: 750; margin-bottom: 6px; font-size: 17px; letter-spacing: -0.02em; }
      .empty-text { font-size: 13px; line-height: 1.5; }
      .empty-text kbd { border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; font-size: 11px; background: var(--surface-2); color: var(--text); font-weight: 700; font-family: inherit; }
      .empty-cta { margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 650; font-size: 13px; padding: 10px 16px; }
      .empty-cta svg { width: 14px; height: 14px; }

      /* Modal */
      .modal-backdrop {
        position: fixed; inset: 0;
        background: rgba(12, 12, 18, 0.45);
        backdrop-filter: blur(8px);
        display: none; align-items: center; justify-content: center;
        padding: 20px; z-index: 20;
      }
      .modal-backdrop.open { display: flex; }
      .modal {
        width: 100%; max-width: 520px;
        background: var(--surface);
        border: 1px solid var(--border); border-radius: 20px;
        box-shadow: var(--shadow-lg);
        padding: 22px;
        animation: modalIn 180ms ease;
        max-height: 90vh; overflow-y: auto;
      }
      @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
      .modal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
      .modal-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); flex-shrink: 0; }
      .modal-ico svg { width: 18px; height: 18px; }
      .modal-head h2 { margin: 0; letter-spacing: -0.03em; font-size: 18px; font-weight: 750; flex: 1; }
      .modal-close { width: 32px; height: 32px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); border-radius: 9px; display: grid; place-items: center; }
      .modal-close svg { width: 15px; height: 15px; }
      .modal-close:hover { color: var(--text); border-color: var(--border-strong); }
      .shortcut-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
      .shortcut-row:first-of-type { border-top: 0; }
      .shortcut-row span:first-child { color: var(--text); font-weight: 550; }
      .shortcut-row kbd { border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; margin-left: 4px; font-size: 11px; background: var(--surface-2); color: var(--text); font-weight: 700; font-family: inherit; }
      .field { margin-bottom: 14px; }
      .field label { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
      .field label svg { width: 13px; height: 13px; }
      .field input, .field textarea, .field select {
        width: 100%;
        border: 1px solid var(--border); border-radius: 11px;
        outline: none; background: var(--surface); color: var(--text);
        padding: 11px 12px; font-size: 14px;
        transition: border var(--transition), box-shadow var(--transition);
      }
      .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--border-strong); }
      .field input.input-error { border-color: var(--danger) !important; box-shadow: none; }
      .field textarea { min-height: 90px; resize: vertical; }
      .modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
      .btn { border: 1px solid var(--border); border-radius: 11px; padding: 10px 16px; background: var(--surface); color: var(--text); font-weight: 650; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; transition: all var(--transition); }
      .btn svg { width: 14px; height: 14px; }
      .btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
      .btn.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
      .btn.primary:hover { background: var(--accent-hover); }
      .btn.danger { border-color: var(--danger); background: var(--danger); color: #1c1214; }
      .btn.danger:hover { background: var(--danger); border-color: var(--danger); opacity: 0.88; }
      .modal.narrow { max-width: 420px; }
      .modal-sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }

      /* Toast */
      .toast {
        position: fixed; right: 22px; bottom: 22px;
        display: flex; align-items: center; gap: 9px;
        padding: 12px 16px 12px 12px;
        background: var(--accent); color: var(--on-accent);
        border-radius: 13px; font-size: 13px; font-weight: 600;
        box-shadow: var(--shadow-lg);
        transform: translateY(15px); opacity: 0; pointer-events: none;
        transition: all 200ms ease; z-index: 50;
        max-width: min(360px, calc(100vw - 44px));
      }
      .toast.show { opacity: 1; transform: none; }
      .toast.success { background: var(--accent); color: var(--on-accent); }
      .toast.error { background: var(--danger); color: #1c1214; }
      .toast-ico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: rgba(0,0,0,.18); flex-shrink: 0; }
      .toast-ico svg { width: 14px; height: 14px; }

      /* Mobile */
      .mobile-header { display: none; }
      .mobile-nav { display: none; }

      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 99px; border: 2px solid var(--bg); }
      ::-webkit-scrollbar-track { background: transparent; }

      @media (max-width: 760px) {
        .sidebar { display: none; }
        .mobile-header {
          display: flex; align-items: center; justify-content: space-between;
          padding: 14px 16px;
          border-bottom: 1px solid var(--border);
          background: color-mix(in srgb, var(--surface) 90%, transparent);
          backdrop-filter: blur(10px);
          position: sticky; top: 0; z-index: 10;
        }
        .mobile-header .brand { padding: 0; }
        .icon-btn.primary.mobile-add {
          width: auto;
          padding: 0 16px;
          display: inline-flex; align-items: center; justify-content: center; gap: 6px;
          font-size: 14px; font-weight: 650; white-space: nowrap;
        }
        .mobile-add-text { display: inline; }
        .mobile-nav {
          display: block;
          position: sticky; top: 63px; z-index: 9;
          background: color-mix(in srgb, var(--bg) 92%, transparent);
          backdrop-filter: blur(10px);
          border-bottom: 1px solid var(--border);
          padding: 10px 16px;
        }
        .m-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .m-scroll::-webkit-scrollbar { display: none; }
        .m-chip {
          flex-shrink: 0;
          display: inline-flex; align-items: center; gap: 7px;
          border: 1px solid var(--border); background: var(--surface); color: var(--muted);
          border-radius: 99px; padding: 8px 13px; font-size: 13px; font-weight: 650;
        }
        .m-chip svg { width: 14px; height: 14px; }
        .m-chip.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
        .main { padding: 22px 16px 70px; }
        .topbar { margin-bottom: 20px; }
        .page-title { font-size: 26px; }
        .date-pill { display: none; }
        .todo { grid-template-columns: 26px 1fr; position: relative; padding-right: 72px; }
        .todo-meta { grid-column: 2; justify-content: flex-start; }
        .todo-actions { position: absolute; right: 8px; top: 8px; }
        .todo-action { opacity: 1; width: 30px; height: 30px; }
        .shortcut { display: none; }
        .search, .quick-add input, .field input, .field textarea, .field select { font-size: 16px; }
        .quick-add { padding: 6px; }
        .add-todo { padding: 10px 12px; }
        .add-todo span { display: none; }
        .modal-row { grid-template-columns: 1fr; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>

  <body>
    <div class="app">

            <span>Inbox</span>

          <button class="nav-item" data-view="today" onclick="changeView('today')">

            <span>Today</span>
            <span class="nav-count" id="todayCount"></span>
          </button>

          <button class="nav-item" data-view="upcoming" onclick="changeView('upcoming')">
            <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg></span>

            <span>Completed</span>

        <div class="section-label"><span>Folders</span><span class="hint" id="folderHint"></span></div>

        <div id="folderList"></div>

        <button class="add-folder" onclick="addFolder()">

    <script>
      /* =========================================
       DATA
    ========================================= */

      const STORAGE_KEY = "focus-todo-app";

      const defaultData = {
        todos: [],
        folders: [
          { id: "personal", name: "Personal" },
          { id: "work", name: "Work" },
          { id: "projects", name: "Projects" },
          { id: "shopping", name: "Shopping" },
        ],
      };

      const FOLDER_COLORS = ["#b8b8b2", "#9db8ad", "#c0b191", "#b39aa5", "#93a7c4", "#a8a8c9", "#8fb0a5"];
      const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
      const ICON_ALERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>';
      const ICON_FOLDER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>';
      const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
      const ICON_PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
      const ICON_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="M3 10h18"/></svg>';
      const ICON_FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>';

      let data = loadData();
      let currentView = "inbox";
      let searchQuery = "";

      function loadData() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);

          if (!saved) return structuredClone(defaultData);

          const merged = {
            ...structuredClone(defaultData),
            ...JSON.parse(saved),
          };

          if (!Array.isArray(merged.todos)) merged.todos = [];
          if (!Array.isArray(merged.folders)) merged.folders = [];

          return merged;
        } catch {
          return structuredClone(defaultData);
        }
      }

      function saveData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch {
          toast("Could not save — storage is full", "error");
        }
      }

      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2);
      }

      function folderColor(id) {
        let h = 0;
        for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
        return FOLDER_COLORS[h % FOLDER_COLORS.length];
      }

      /* =========================================
       INITIALIZE
    ========================================= */

      function init() {
        document.documentElement.dataset.theme = "dark";

        const pill = document.getElementById("datePill");
        if (pill) {
          pill.innerHTML = ICON_CAL + "<span>" + new Date().toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) + "</span>";
        }

        renderFolders();
        updateCounts();
        render();

        document
          .getElementById("quickInput")
          .addEventListener("keydown", (e) => {
            if (e.key === "Enter") quickAdd();
          });

        document
          .getElementById("searchInput")
          .addEventListener("input", (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            render();
          });

        document.addEventListener("keydown", handleShortcuts);

        document.getElementById("todoModal").addEventListener("click", (e) => {
          if (e.target.id === "todoModal") closeTodoModal();
        });

        window.addEventListener("storage", (e) => {
          if (e.key !== STORAGE_KEY) return;
          if (
            document.getElementById("todoModal").classList.contains("open")
          ) {
            return;
          }

          data = loadData();
          renderFolders();
          updateCounts();
          render();
        });

        window.addEventListener("popstate", () => {
          if (
            document.getElementById("confirmModal").classList.contains("open")
          ) {
            dismissConfirm(false, true);
            return;
          }

          if (
            document.getElementById("promptModal").classList.contains("open")
          ) {
            dismissPrompt(null, true);
            return;
          }

          if (!anyModalOpen()) return;

          hideModals();
          modalEntryPushed = false;
          restoreModalFocus();
        });

        document.getElementById("todoModal").addEventListener("keydown", trapModalTab);

        document.getElementById("todoModal").addEventListener("keydown", (e) => {
          if (
            e.key === "Enter" &&
            e.target.tagName !== "TEXTAREA" &&
            e.target.tagName !== "BUTTON"
          ) {
            e.preventDefault();
            saveTodo();
          }
        });

        document.getElementById("todoTitle").addEventListener("input", (e) => {
          e.target.classList.remove("input-error");
        });

        document.getElementById("helpModal").addEventListener("click", (e) => {
          if (e.target.id === "helpModal") closeHelp();
        });

        document.getElementById("helpModal").addEventListener("keydown", trapModalTab);

        document.getElementById("confirmModal").addEventListener("click", (e) => {
          if (e.target.id === "confirmModal") dismissConfirm(false);
        });

        document.getElementById("confirmModal").addEventListener("keydown", trapModalTab);

        document.getElementById("promptModal").addEventListener("click", (e) => {
          if (e.target.id === "promptModal") dismissPrompt(null);
        });

        document.getElementById("promptModal").addEventListener("keydown", trapModalTab);

        document.getElementById("promptModal").addEventListener("keydown", (e) => {
          if (e.key === "Enter" && e.target.tagName !== "BUTTON") {
            e.preventDefault();
            submitPrompt();
          }
        });

        document.getElementById("promptInput").addEventListener("input", (e) => {
          e.target.classList.remove("input-error");
        });
      }

      /* =========================================
       VIEWS
    ========================================= */

      function syncActive() {
        document.querySelectorAll("[data-view]").forEach((item) => {
          item.classList.toggle("active", item.dataset.view === currentView);
        });
        document.querySelectorAll("[data-folder]").forEach((item) => {
          item.classList.toggle("active", currentView === "folder:" + item.dataset.folder);
        });
      }

      function changeView(view) {
        currentView = view;
        searchQuery = "";
        document.getElementById("searchInput").value = "";
        syncActive();
        renderFolders();
        render();
      }

      function getViewTodos() {
        let todos = [...data.todos];

        if (currentView === "today") {
          const today = todayString();

          todos = todos.filter((todo) => todo.due === today && !todo.completed);
        }

        if (currentView === "upcoming") {
          const today = todayString();

          todos = todos.filter(
            (todo) => todo.due && todo.due > today && !todo.completed,
          );
        }

        if (currentView === "completed") {
          todos = todos.filter((todo) => todo.completed);
        }

        if (currentView.startsWith("folder:")) {
          const folderId = currentView.replace("folder:", "");

          todos = todos.filter(
            (todo) => todo.folderId === folderId && !todo.completed,
          );
        }

        if (currentView === "inbox") {
          todos = todos.filter((todo) => !todo.completed);
        }

        if (searchQuery) {
          todos = todos.filter(
            (todo) =>
              todo.title.toLowerCase().includes(searchQuery) ||
              (todo.description || "").toLowerCase().includes(searchQuery),
          );
        }

        todos.sort((a, b) => {
          if (a.completed !== b.completed) {
            return Number(a.completed) - Number(b.completed);
          }

          if (a.due && b.due) {
            return a.due.localeCompare(b.due);
          }

          if (a.due) return -1;
          if (b.due) return 1;

          return b.createdAt - a.createdAt;
        });

        return todos;
      }

      function render() {
        const todos = getViewTodos();

        const titles = {
          inbox: ["Inbox", "Your active todos"],
          today: ["Today", "Everything due today"],
          upcoming: ["Upcoming", "Todos coming up"],
          completed: ["Completed", "Things you've finished"],
        };

        let title = titles[currentView]?.[0];
        let subtitle = titles[currentView]?.[1];

        if (currentView.startsWith("folder:")) {
          const id = currentView.replace("folder:", "");
          const folder = data.folders.find((f) => f.id === id);

          title = folder ? folder.name : "Folder";
          subtitle = "Todos in this folder";
        }

        if (searchQuery) {
          title = "Search";
          subtitle = `${todos.length} result${todos.length === 1 ? "" : "s"}`;
        }

        document.getElementById("pageTitle").textContent = title;
        document.getElementById("pageSubtitle").textContent =
          subtitle || `${todos.length} todos`;

        const list = document.getElementById("todoList");

        if (!todos.length) {
          list.innerHTML = emptyState();
          return;
        }

        list.innerHTML = todos.map(todoHTML).join("");
      }

      /* =========================================
       TODO RENDERING
    ========================================= */

      function todoHTML(todo) {
        const priority =
          todo.priority && todo.priority !== "none"
            ? `<span class="pill priority ${todo.priority}"><span class="pdot"></span>${capitalize(todo.priority)}</span>`
            : "";

        let due = "";
        if (todo.due) {
          const overdue = !todo.completed && todo.due < todayString();
          due = `<span class="pill due ${overdue ? "overdue" : ""}">${ICON_CAL}<span>${overdue ? "Overdue · " : ""}${formatDate(todo.due)}</span></span>`;
        }

        let folderTag = "";
        if (todo.folderId) {
          const f = data.folders.find((x) => x.id === todo.folderId);
          if (f) {
            folderTag = `<span class="pill folder-tag"><span class="fdot" style="background:${folderColor(f.id)}"></span><span>${escapeHTML(f.name)}</span></span>`;
          }
        }

        const description = todo.description
          ? `<div class="todo-description">
              ${escapeHTML(todo.description)}
             </div>`
          : "";

        return `
        <article class="todo ${todo.completed ? "completed" : ""}">
          <button
            class="checkbox"
            aria-label="${todo.completed ? "Mark incomplete" : "Complete todo"}"
            onclick="toggleTodo('${todo.id}')"
          >${ICON_CHECK}</button>

          <div class="todo-main">
            <input
              class="todo-title"
              value="${escapeAttr(todo.title)}"
              onchange="updateTitle('${todo.id}', this.value)"
              aria-label="Todo title"
            />
            ${description}
          </div>

          <div class="todo-meta">
            ${priority}
            ${folderTag}
            ${due}
            <div class="todo-actions">
              <button
                class="todo-action"
                onclick="editTodo('${todo.id}')"
                title="Edit"
                aria-label="Edit todo"
              >${ICON_PENCIL}</button>

              <button
                class="todo-action delete"
                onclick="deleteTodo('${todo.id}')"
                title="Delete"
                aria-label="Delete todo"
              >${ICON_TRASH}</button>
            </div>
          </div>
        </article>
      `;
      }

      function emptyState() {
        const messages = {
          inbox: ["All caught up", "No active todos. Press <kbd>N</kbd> to add one."],
          today: ["Nothing due today", "Clear schedule. Press <kbd>N</kbd> to plan something."],
          upcoming: ["No upcoming todos", "Add a due date to plan ahead."],
          completed: [
            "Nothing completed yet",
            "Finished todos will appear here.",
          ],
        };

        const msg = messages[currentView] || [
          "No todos here",
          "Press <kbd>N</kbd> to add your first todo.",
        ];

        return `
        <div class="empty">
          <div class="empty-art" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
          </div>
          <div class="empty-title">${msg[0]}</div>
          <div class="empty-text">${msg[1]}</div>
          <button class="empty-cta" onclick="openTodoModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            New todo
          </button>
        </div>
      `;
      }

      /* =========================================
       TODO ACTIONS
    ========================================= */

      function quickAdd() {
        const input = document.getElementById("quickInput");
        const title = input.value.trim();

        if (!title) return;

        data.todos.unshift({
          id: uid(),
          title,
          description: "",
          completed: false,
          due: "",
          priority: "none",
          folderId: getCurrentFolderId(),
          createdAt: Date.now(),
        });

        saveData();

        input.value = "";

        updateCounts();
        renderFolders();
        render();

        toast("Todo added");
      }

      function toggleTodo(id) {
        const todo = data.todos.find((t) => t.id === id);

        if (!todo) return;

        todo.completed = !todo.completed;

        saveData();
        updateCounts();
        renderFolders();
        render();

        toast(todo.completed ? "Todo completed" : "Todo reopened");
      }

      function updateTitle(id, value) {
        const todo = data.todos.find((t) => t.id === id);

        if (!todo) return;

        value = value.trim();

        if (!value) {
          deleteTodo(id);
          return;
        }

        todo.title = value;

        saveData();
        render();
      }

      function deleteTodo(id) {
        const todo = data.todos.find((t) => t.id === id);

        if (!todo) return;

        askConfirm({
          title: "Delete todo?",
          message: `"${todo.title}" will be permanently deleted.`,
          confirmText: "Delete",
        }).then((ok) => {
          if (!ok) return;
          if (!data.todos.some((t) => t.id === id)) return;

          data.todos = data.todos.filter((t) => t.id !== id);

          saveData();
          updateCounts();
          renderFolders();
          render();

          toast("Todo deleted");
        });
      }

      /* =========================================
       MODAL
    ========================================= */

      function getCurrentFolderId() {
        if (!currentView.startsWith("folder:")) return "";
        const folderId = currentView.replace("folder:", "");
        return data.folders.some((f) => f.id === folderId) ? folderId : "";
      }

      function openTodoModal(id = null) {
        const todo = id ? data.todos.find((t) => t.id === id) : null;

        if (id && !todo) return;

        const helpWasOpen = document
          .getElementById("helpModal")
          .classList.contains("open");

        hideModals();
        cancelPendingOverlays();

        const modal = document.getElementById("todoModal");

        document.getElementById("editId").value = id || "";
        populateFolderSelect();

        if (todo) {
          document.getElementById("modalTitle").textContent = "Edit Todo";
          document.getElementById("todoTitle").value = todo.title;
          document.getElementById("todoDescription").value =
            todo.description || "";
          document.getElementById("todoDue").value = todo.due || "";
          document.getElementById("todoPriority").value =
            todo.priority || "none";
          document.getElementById("todoFolder").value = todo.folderId || "";
        } else {
          document.getElementById("modalTitle").textContent = "New Todo";
          document.getElementById("todoTitle").value = "";
          document.getElementById("todoDescription").value = "";
          document.getElementById("todoDue").value = "";
          document.getElementById("todoPriority").value = "none";
          document.getElementById("todoFolder").value = getCurrentFolderId();
        }

        pushModalEntry();
        modal.classList.add("open");

        if (!helpWasOpen) {
          lastFocused = document.activeElement;
        }

        setTimeout(() => {
          document.getElementById("todoTitle").focus();
        }, 50);
      }

      function closeTodoModal() {
        if (!document.getElementById("todoModal").classList.contains("open")) {
          return;
        }

        hideModals();
        restoreModalFocus();
        popModalEntry();
      }

      let lastFocused = null;
      let modalEntryPushed = false;

      function anyModalOpen() {
        return document.querySelector(".modal-backdrop.open") !== null;
      }

      function pushModalEntry() {
        if (modalEntryPushed) return;

        try {
          history.pushState({ modal: true }, "");
          modalEntryPushed = true;
        } catch {
          // History unavailable (e.g. restricted webview): modals still
          // work, system back just navigates normally.
        }
      }

      function hideModals() {
        document
          .querySelectorAll(".modal-backdrop.open")
          .forEach((m) => m.classList.remove("open"));
      }

      function restoreModalFocus() {
        if (lastFocused && document.contains(lastFocused)) {
          lastFocused.focus();
        }

        lastFocused = null;
      }

      function popModalEntry() {
        if (!modalEntryPushed) return;

        modalEntryPushed = false;
        history.back();
      }

      function trapModalTab(e) {
        if (e.key !== "Tab") return;

        const modal = e.currentTarget;

        if (!modal || !modal.classList.contains("open")) return;

        const items = [
          ...modal.querySelectorAll("input, textarea, select, button"),
        ].filter((el) => !el.disabled && el.type !== "hidden");

        if (!items.length) return;

        const first = items[0];
        const last = items[items.length - 1];

        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }

      function editTodo(id) {
        openTodoModal(id);
      }

      function openHelp() {
        if (document.getElementById("todoModal").classList.contains("open")) {
          return;
        }

        const modal = document.getElementById("helpModal");

        if (modal.classList.contains("open")) return;

        hideModals();
        cancelPendingOverlays();

        lastFocused = document.activeElement;
        pushModalEntry();
        modal.classList.add("open");
      }

      function closeHelp() {
        if (!document.getElementById("helpModal").classList.contains("open")) {
          return;
        }

        hideModals();
        restoreModalFocus();
        popModalEntry();
      }

      let confirmState = null;
      let promptState = null;

      function askConfirm({ title, message, confirmText = "Delete" }) {
        return new Promise((resolve) => {
          document.getElementById("confirmTitle").textContent = title;
          document.getElementById("confirmMessage").textContent = message;
          document.getElementById("confirmOk").textContent = confirmText;

          const ownsEntry = !anyModalOpen();
          confirmState = { resolve, ownsEntry };

          if (ownsEntry) {
            lastFocused = document.activeElement;
            pushModalEntry();
          }

          document.getElementById("confirmModal").classList.add("open");
          document.getElementById("confirmCancel").focus();
        });
      }

      function dismissConfirm(value, fromPop = false) {
        const modal = document.getElementById("confirmModal");

        if (!modal.classList.contains("open")) return;

        modal.classList.remove("open");

        const st = confirmState;
        confirmState = null;

        if (fromPop) {
          modalEntryPushed = false;
        } else if (st && st.ownsEntry) {
          modalEntryPushed = false;
          history.back();
        }

        restoreModalFocus();

        if (st) st.resolve(value);
      }

      function askPrompt({ title, message, placeholder = "", confirmText = "Save" }) {
        return new Promise((resolve) => {
          document.getElementById("promptTitle").textContent = title;
          document.getElementById("promptMessage").textContent = message;

          const input = document.getElementById("promptInput");
          input.value = "";
          input.placeholder = placeholder;
          input.setAttribute("aria-label", title);
          input.classList.remove("input-error");

          document.getElementById("promptOk").textContent = confirmText;

          const ownsEntry = !anyModalOpen();
          promptState = { resolve, ownsEntry };

          if (ownsEntry) {
            lastFocused = document.activeElement;
            pushModalEntry();
          }

          document.getElementById("promptModal").classList.add("open");

          setTimeout(() => {
            document.getElementById("promptInput").focus();
          }, 50);
        });
      }

      function submitPrompt() {
        if (!promptState) return;

        const input = document.getElementById("promptInput");
        const value = input.value.trim();

        if (!value) {
          input.classList.add("input-error");
          input.focus();
          return;
        }

        dismissPrompt(value);
      }

      function dismissPrompt(value, fromPop = false) {
        const modal = document.getElementById("promptModal");

        if (!modal.classList.contains("open")) return;

        modal.classList.remove("open");

        const st = promptState;
        promptState = null;

        if (fromPop) {
          modalEntryPushed = false;
        } else if (st && st.ownsEntry) {
          modalEntryPushed = false;
          history.back();
        }

        restoreModalFocus();

        if (st) st.resolve(value);
      }

      function cancelPendingOverlays() {
        if (confirmState) {
          const st = confirmState;
          confirmState = null;
          st.resolve(false);
        }

        if (promptState) {
          const st = promptState;
          promptState = null;
          st.resolve(null);
        }
      }

      function saveTodo() {
        const id = document.getElementById("editId").value;
        const titleInput = document.getElementById("todoTitle");

        const title = titleInput.value.trim();

        if (!title) {
          titleInput.classList.add("input-error");
          titleInput.focus();
          toast("Enter a title to save", "error");
          return;
        }

        titleInput.classList.remove("input-error");

        const selectedFolderId =
          document.getElementById("todoFolder").value;

        const todoData = {
          title,
          description: document.getElementById("todoDescription").value.trim(),
          due: document.getElementById("todoDue").value,
          priority: document.getElementById("todoPriority").value,
          folderId: data.folders.some((f) => f.id === selectedFolderId)
            ? selectedFolderId
            : "",
        };

        if (id) {
          const todo = data.todos.find((t) => t.id === id);

          if (todo) {
            Object.assign(todo, todoData);
            toast("Todo updated");
          }
        } else {
          data.todos.unshift({
            id: uid(),
            ...todoData,
            completed: false,
            createdAt: Date.now(),
          });

          toast("Todo created");
        }

        saveData();
        updateCounts();
        renderFolders();
        render();
        closeTodoModal();
      }

      function populateFolderSelect() {
        const select = document.getElementById("todoFolder");

        select.innerHTML =
          `<option value="">No folder</option>` +
          data.folders
            .map(
              (folder) =>
                `<option value="${escapeAttr(folder.id)}">
              ${escapeHTML(folder.name)}
            </option>`,
            )
            .join("");
      }

      /* =========================================
       FOLDERS
    ========================================= */

      function renderFolders() {
        const container = document.getElementById("folderList");

        container.innerHTML = data.folders
          .map((folder) => {
            const count = data.todos.filter(
              (t) => t.folderId === folder.id && !t.completed,
            ).length;

            return `
        <button
            class="nav-item ${currentView === "folder:" + folder.id ? "active" : ""}"
            data-folder="${escapeAttr(folder.id)}"
            onclick="changeFolder('${folder.id}')"
          >
            <span class="nav-icon">${ICON_FOLDER}</span>
            <span class="folder-dot" style="background:${folderColor(folder.id)}"></span>
            <span class="folder-name">${escapeHTML(folder.name)}</span>
            <span class="nav-count"${count ? "" : " hidden"}>
              ${count || ""}
            </span>
            <span
              class="folder-delete"
              role="button"
              tabindex="0"
              title="Delete folder"
              aria-label="Delete ${escapeAttr(folder.name)}"
              onclick="event.stopPropagation();deleteFolder('${folder.id}')"
              onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();deleteFolder('${folder.id}')}"
            >${ICON_TRASH}</span>
          </button>
      `;
          })
          .join("");

        const hint = document.getElementById("folderHint");
        if (hint) hint.textContent = data.folders.length ? data.folders.length + "" : "";

        const mobile = document.getElementById("mobileFolderList");
        if (mobile) {
          mobile.innerHTML = data.folders
            .map(
              (f) => `<button class="m-chip ${currentView === "folder:" + f.id ? "active" : ""}" data-folder="${escapeAttr(f.id)}" onclick="changeFolder('${f.id}')">`
                + `<span class="folder-dot" style="background:${folderColor(f.id)}"></span>${escapeHTML(f.name)}</button>`
            )
            .join("");
        }

        syncActive();
      }

      function changeFolder(id) {
        currentView = "folder:" + id;
        searchQuery = "";
        const s = document.getElementById("searchInput");
        if (s) s.value = "";
        renderFolders();
        render();
      }

      function addFolder() {
        askPrompt({
          title: "New folder",
          message: "Give your folder a name.",
          placeholder: "e.g. Reading list",
          confirmText: "Create folder",
        }).then((cleanName) => {
          if (cleanName === null) return;

          if (
            data.folders.some(
              (f) => f.name.toLowerCase() === cleanName.toLowerCase(),
            )
          ) {
            toast("That folder already exists", "error");
            return;
          }

          data.folders.push({
            id: uid(),
            name: cleanName,
          });

          saveData();
          renderFolders();
          populateFolderSelect();

          toast("Folder created");
        });
      }

      function deleteFolder(id) {
        const folder = data.folders.find((f) => f.id === id);

        if (!folder) return;

        askConfirm({
          title: "Delete folder?",
          message: `"${folder.name}" will be removed. Its todos will stay in your inbox.`,
          confirmText: "Delete",
        }).then((ok) => {
          if (!ok) return;
          if (!data.folders.some((f) => f.id === id)) return;

          data.todos.forEach((todo) => {
            if (todo.folderId === id) {
              todo.folderId = "";
            }
          });

          data.folders = data.folders.filter((f) => f.id !== id);

          if (currentView === "folder:" + id) {
            currentView = "inbox";
          }

          saveData();

          renderFolders();
          syncFolderSelect();
          updateCounts();
          render();

          toast("Folder deleted");
        });
      }

      function syncFolderSelect() {
        const modal = document.getElementById("todoModal");
        const select = document.getElementById("todoFolder");

        if (!modal.classList.contains("open") || !select) return;

        const keep = select.value;
        populateFolderSelect();
        select.value = data.folders.some((f) => f.id === keep) ? keep : "";
      }

      /* =========================================
       COUNTS
    ========================================= */

      function updateCounts() {
        const today = todayString();

        let activeCount = 0;
        let completedCount = 0;
        let todayCount = 0;

        for (const t of data.todos) {
          if (t.completed) {
            completedCount++;
          } else {
            activeCount++;
            if (t.due === today) todayCount++;
          }
        }

        setCount("inboxCount", activeCount);
        setCount("completedCount", completedCount);
        setCount("todayCount", todayCount);

        const total = data.todos.length;
        const pct = total ? Math.round((completedCount / total) * 100) : 0;
        const bar = document.getElementById("progressBar");
        const txt = document.getElementById("progressText");
        if (bar) bar.style.width = pct + "%";
        if (txt) txt.textContent = completedCount + " / " + total;
      }

      function setCount(id, count) {
        const el = document.getElementById(id);

        if (!el) return;

        el.textContent = count || "";
        el.hidden = !count;
      }

      /* =========================================
       KEYBOARD SHORTCUTS
    ========================================= */

      function handleShortcuts(e) {
        const active = document.activeElement;
        const typing =
          active &&
          (active.tagName === "INPUT" ||
            active.tagName === "TEXTAREA" ||
            active.tagName === "SELECT");

        const overlayOpen =
          document.getElementById("confirmModal").classList.contains("open") ||
          document.getElementById("promptModal").classList.contains("open");

        if (overlayOpen && e.key !== "Escape") return;

        if (e.key === "/" && !typing) {
          e.preventDefault();
          focusSearch();
        }

        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          focusSearch();
        }

        if (e.key.toLowerCase() === "n" && !typing) {
          e.preventDefault();
          openTodoModal();
        }

        if (e.key === "?" && !typing) {
          e.preventDefault();
          openHelp();
        }

        if (e.key === "Escape") {
          const confirmOpen = document
            .getElementById("confirmModal")
            .classList.contains("open");
          const promptOpen = document
            .getElementById("promptModal")
            .classList.contains("open");
          const helpOpen = document
            .getElementById("helpModal")
            .classList.contains("open");
          const todoOpen = document
            .getElementById("todoModal")
            .classList.contains("open");

          if (confirmOpen) {
            dismissConfirm(false);
          } else if (promptOpen) {
            dismissPrompt(null);
          } else if (helpOpen) {
            closeHelp();
          } else if (todoOpen) {
            closeTodoModal();
          } else if (
            document.activeElement ===
            document.getElementById("searchInput")
          ) {
            document.activeElement.blur();
          }
        }
      }

      function focusSearch() {
        const search = document.getElementById("searchInput");

        if (!search) return;

        search.focus();
        search.select();
      }

      /* =========================================
       HELPERS
    ========================================= */

      function todayString() {
        const now = new Date();

        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, "0");
        const d = String(now.getDate()).padStart(2, "0");

        return `${y}-${m}-${d}`;
      }

      function formatDate(dateString) {
        const date = new Date(dateString + "T00:00:00");

        return date.toLocaleDateString(undefined, {
          month: "short",
          day: "numeric",
        });
      }

      function capitalize(value) {
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      function escapeHTML(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function escapeAttr(value) {
        return escapeHTML(value);
      }

      let toastTimer;

      function toast(message, type = "success") {
        const element = document.getElementById("toast");
        const text = document.getElementById("toastText");
        const icon = document.getElementById("toastIcon");

        if (text) text.textContent = message;
        else element.textContent = message;
        element.classList.remove("success", "error");
        element.classList.add(type === "error" ? "error" : "success");
        if (icon) icon.innerHTML = type === "error" ? ICON_ALERT : ICON_CHECK;
        element.classList.add("show");

        clearTimeout(toastTimer);

        toastTimer = setTimeout(() => {
          element.classList.remove("show");
        }, 1800);
      }

      /* =========================================
       START
    ========================================= */

      init();
    </script>
  </body>
</html>
